name: Publish to npm

# Publishes to npm via OIDC "trusted publishing" — no NPM_TOKEN secret required.
# Trigger by pushing a version tag, e.g.:
#   git tag v1.4.1 && git push origin v1.4.1
# or run manually from the Actions tab (workflow_dispatch).
#
# Requires a one-time setup on npmjs.com:
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization/user: Tailor
#     Repository:        MasterRecord   (match your repo's exact name)
#     Workflow filename: publish.yml
#     Environment:       (leave blank)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # REQUIRED: lets npm exchange the GitHub OIDC token (and adds provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # setup-node bundles an older npm; OIDC trusted publishing needs npm >= 11.5.1.
      - name: Ensure OIDC-capable npm
        run: npm install -g npm@latest

      # No install/build step: npm publish packs the source files listed in
      # package.json "files". OIDC provides auth automatically (no token env).
      - name: Publish
        run: npm publish --ignore-scripts
