name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} · sqlite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    # CI runs the SQLite unit suite only. The cross-engine MySQL/Postgres
    # integration tests (test/integration/cross-engine.test.js) are gated on
    # MR_TEST_MYSQL_URL / MR_TEST_PG_URL and auto-skip when those are unset — so
    # they don't run here (no service containers spun up). To exercise them
    # locally, start a MySQL/Postgres and set those env vars before `npm test`.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Test (SQLite unit; MySQL/Postgres integration auto-skips)
        run: npm test
